name: Release

# Push a tag like v1.0.0-pre.1 and this builds the app and publishes a GitHub pre-release with the APK attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "leestn-${GITHUB_REF_NAME}.apk"
      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: leestn-*.apk
          prerelease: true
          generate_release_notes: true
