name: Release

# Push a tag like v1.5.0 and this builds a SIGNED APK and publishes a GitHub release with it attached.
# The app's "Check for updates" reads these releases. Tags with a dash (v1.6.0-pre.1) become pre-releases.
# One-time setup: see release/RELEASE-1.5.0.md ("Signing key") to add the four secrets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the signing secrets exist
        env:
          B64: ${{ secrets.LEESTN_KEYSTORE_BASE64 }}
          PW: ${{ secrets.LEESTN_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.LEESTN_KEY_ALIAS }}
          KP: ${{ secrets.LEESTN_KEY_PASSWORD }}
        run: |
          if [ -z "$B64" ] || [ -z "$PW" ] || [ -z "$AL" ] || [ -z "$KP" ]; then
            echo "::error::Signing secrets are missing. Without them the APK would get a random key and in-app updates would fail. See release/RELEASE-1.5.0.md."
            exit 1
          fi

      - name: Decode the key
        env:
          B64: ${{ secrets.LEESTN_KEYSTORE_BASE64 }}
        run: echo "$B64" | base64 -d > "$RUNNER_TEMP/leestn.jks"

      - name: Build signed APK
        env:
          LEESTN_KEYSTORE_FILE: ${{ runner.temp }}/leestn.jks
          LEESTN_KEYSTORE_PASSWORD: ${{ secrets.LEESTN_KEYSTORE_PASSWORD }}
          LEESTN_KEY_ALIAS: ${{ secrets.LEESTN_KEY_ALIAS }}
          LEESTN_KEY_PASSWORD: ${{ secrets.LEESTN_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "leestn-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: leestn-*.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
