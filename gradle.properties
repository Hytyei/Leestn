org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Compile Kotlin inside the Gradle process instead of a separate Kotlin daemon.
# Fixes "Could not connect to Kotlin compile daemon" (firewall, VPN, antivirus, low memory, IPv6 quirks).
kotlin.compiler.execution.strategy=in-process
